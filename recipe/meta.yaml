{% set name = "asyncssh" %}
{% set version = "2.24.2" %}
{% set sha256 = "d55e313d66717a697d940f55adf5eeef7d740b4b7d177fe004212ee98e337bef" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - cryptography >=48.0.1
    - pyopenssl >=23.0.0
    - python-gssapi >=1.2.0
    - typing_extensions >=4.0.0

test:
  imports:
    - asyncssh
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ronf/asyncssh
  license: EPL-1.0
  summary: 'AsyncSSH: Asynchronous SSHv2 client and server library'

extra:
  recipe-maintainers:
    - apmorton
    - vamega
